name: UQONI ONE build and quality
on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/uqoni-one-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit and security tests
        run: npm test
      - name: Production build
        run: npm run build
